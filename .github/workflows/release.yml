name: Release

# Builds the installers for a version tag (e.g. v0.2.0) and attaches them to
# a draft release, which is published by hand after checking it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: |
            release/*/*.exe
            release/*/*.dmg
          if-no-files-found: error

  release:
    name: Draft release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Create draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" installers/*/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --title "ArtGallery $TAG"
          --generate-notes
