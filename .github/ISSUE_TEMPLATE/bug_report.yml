name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        No adjuntes bases de datos, copias de seguridad ni fotografías reales: pueden contener datos personales.
  - type: textarea
    id: what-happened
    attributes:
      label: Qué ocurre
      description: Qué esperabas y qué pasó en su lugar.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir la galería
        2. …
    validations:
      required: true
  - type: dropdown
    id: data-impact
    attributes:
      label: ¿Se han perdido o cambiado datos?
      options:
        - "No"
        - Sí, se perdieron o cambiaron datos
        - No lo sé
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de ArtGallery
      placeholder: "0.1.0"
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - macOS
    validations:
      required: true
