appId: io.github.antoniomeht.artgallery
productName: ArtGallery
directories:
  output: release/${version}
files:
  - out/**
  - package.json
# sharp loads native libvips binaries, which cannot run from inside the asar.
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # User data lives outside the install folder and is kept on uninstall.
  deleteAppDataOnUninstall: false

mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      # sharp ships one native binary per architecture; Intel builds are
      # pending a dedicated x64 runner.
      arch: [arm64]
  # Unsigned until a Developer ID certificate is configured.
  identity: null
